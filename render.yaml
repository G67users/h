services:
  - type: web
    name: relay-chat
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/data.db
    disk:
      name: relay-data
      mountPath: /data
      sizeGB: 1
